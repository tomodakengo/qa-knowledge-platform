name: Promote confirmed patterns to instructions

# 週次cronで confidence-high && status-confirmed な open issue を集約し、
# .github/instructions/qa-knowledge-base.instructions.md に追記する PR を起こす。
#
# Setup:
#   1. このリポジトリで一度だけ:  claude /install-github-app
#      → Anthropic 公式の GitHub App をインストール、ANTHROPIC_API_KEY secret を登録
#   2. Settings > Actions > General で
#      "Allow GitHub Actions to create and approve pull requests" を有効化

on:
  schedule:
    # 毎週月曜 9:00 JST = 月曜 0:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pre-check — anything to promote?
        id: precheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh issue list \
            --label confidence-high \
            --label status-confirmed \
            --state open \
            --json number --jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Promotable issues: $count"

      - name: Run Claude to draft promotion PR
        if: steps.precheck.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--allowedTools "Read,Edit,Write,Bash(git:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh pr create:*)"'
          prompt: |
            あなたは weekly promotion bot です。confirmed flaky-pattern issue を QA knowledge base に昇格します。

            手順:

            1. `gh issue list --label confidence-high --label status-confirmed --state open --json number,title,body,labels --limit 20` で対象を取得
            2. 各 issue について `gh issue view <番号>` でコメントを含む全文を確認
            3. `.github/instructions/qa-knowledge-base.instructions.md` を Read で読み、既存の Pattern catalogue を把握
            4. 各 issue を以下のフォーマットで `## Patterns` セクション末尾に追記する Edit を行う:

               ```
               ### P-<label> — <一行要約>

               **Symptom**: <error log 抜粋>
               **Diagnosis**: <root cause>
               **Fix recipe**: <agreed fix>
               **Source issues**: #<番号>
               ```

            5. 制約:
               - 既存パターンと重複していたら新規追加せず既存セクションを更新
               - **Hard bans** 違反の fix （`waitForTimeout`, `.nth(N)`, `getByRole` を CSS 置換）は採用しない
               - Hard bans セクション自体は変更しない

            6. ブランチ作成 → コミット → push → PR作成:

               ```
               BR="auto/promote-$(date -u +%Y%m%d)"
               git config user.name 'github-actions[bot]'
               git config user.email 'github-actions[bot]@users.noreply.github.com'
               git checkout -b "$BR"
               git add .github/instructions/qa-knowledge-base.instructions.md
               git commit -m "Promote confirmed flaky patterns to QA knowledge base ($(date -u +%Y-%m-%d))"
               git push -u origin "$BR"
               gh pr create \
                 --title "Promote confirmed flaky patterns ($(date -u +%Y-%m-%d))" \
                 --body "Auto-generated promotion PR. Reviewer: verify each new Pattern section against the source issue and reject any fix that violates Hard bans. Promoted issues: <番号リスト>"
               ```

            該当 issue が0件なら何もせず終了。
