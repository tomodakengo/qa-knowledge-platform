name: Triage issue with Claude (manual)

# Claude Code Action 版の triage ワークフロー。
# GitHub Models 版 (triage-issue-copilot.yml) が自動 trigger で動くのに対し、
# こちらは workflow_dispatch のみ＝**手動起動の高品質オプション** という位置づけ。
#
# 使いどころ:
#   - 自動 triage (GitHub Models) の結果が薄かった issue に対して、より深い分析を Claude に頼みたい
#   - Hard bans 違反疑いの精査、過去 issue の重複検索を厳密にやりたい
#   - 新しい Pattern を catalogue に取り込むかどうかの判断材料が欲しい
#
# Setup:
#   - https://github.com/apps/claude を対象リポジトリにインストール
#   - Settings > Secrets > Actions に ANTHROPIC_API_KEY を登録

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Triage したい issue 番号（例: 42）'
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Claude triage
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--allowedTools "Read,Bash(gh issue comment:*),Bash(gh issue list:*),Bash(gh issue view:*)"'
          prompt: |
            あなたは GitHub Issue の triage 担当です。

            まず `.github/instructions/triage-prompt.instructions.md` を Read で読み、書かれているフォーマットと方針に従ってください。

            triage 対象:

            - リポジトリ: ${{ github.repository }}
            - issue 番号: #${{ inputs.issue_number }}

            手順:
            1. `gh issue view ${{ inputs.issue_number }}` でタイトル・本文・既存ラベルを取得
            2. 候補となる Pattern label について `gh issue list --label P-<候補> --state all --limit 5` で重複検索
            3. triage-prompt.instructions.md のフォーマットに従ったコメントを作成
            4. `gh issue comment ${{ inputs.issue_number }} --body "<作成したコメント>"` で投稿

            憶測で断定しないこと。確度が低ければ「不明」と書く。
            既に GitHub Models 版の triage コメントが付いていたら、その内容を踏まえて **追加観点** を提示する形でコメントすること（重複は避ける）。
