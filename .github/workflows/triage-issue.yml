name: Triage issue with Claude

# 起票直後の Issue に Pattern label / scope / 重複候補をコメント提案する。
# 直接ラベル付与はせず、人間 triage 担当が確認してから付与する運用。
#
# Setup:
#   1. このリポジトリで一度だけ:  claude /install-github-app
#      → Anthropic 公式の GitHub App をインストール、ANTHROPIC_API_KEY secret を登録
#   2. .github/instructions/triage-prompt.instructions.md がプロンプトとして使われる

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write

jobs:
  triage:
    runs-on: ubuntu-latest
    # ISSUE_TEMPLATE 経由で起票された issue だけを対象にする
    if: contains(github.event.issue.labels.*.name, 'status-triage')
    steps:
      - uses: actions/checkout@v4

      - name: Run Claude triage
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--allowedTools "Read,Bash(gh issue comment:*),Bash(gh issue list:*),Bash(gh issue view:*)"'
          prompt: |
            あなたは GitHub Issue の triage 担当です。

            まず `.github/instructions/triage-prompt.instructions.md` を Read で読み、書かれているフォーマットと方針に従ってください。

            triage 対象の issue 情報:

            - リポジトリ: ${{ github.repository }}
            - issue 番号: #${{ github.event.issue.number }}
            - タイトル: ${{ github.event.issue.title }}
            - 既存ラベル: ${{ join(github.event.issue.labels.*.name, ', ') }}

            手順:
            1. `gh issue view ${{ github.event.issue.number }}` で本文を取得
            2. 候補となる Pattern label について `gh issue list --label P-<候補> --state all --limit 5` で重複検索
            3. triage-prompt.instructions.md のフォーマットに従ったコメントを作成
            4. `gh issue comment ${{ github.event.issue.number }} --body "<作成したコメント>"` で投稿

            憶測で断定しないこと。確度が低ければ「不明」と書く。
